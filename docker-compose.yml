services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance_app
      POSTGRES_PASSWORD: finance_dev
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_app -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10